# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

# theme = "blowfish" # UNCOMMENT THIS LINE

# baseURL is set via the HUGO_BASEURL environment variable and --baseURL flag
baseURL = "https://pierre.mesu.re"
defaultContentLanguage = "en"

pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true
uglyURLs = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputFormats.HTML]
  mediaType = "text/html"
  noUgly = true

[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true

[outputFormats.llms-full]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true

[outputFormats.md]
  mediaType = "text/markdown"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "llms-full", "md"]
  page = ["HTML", "md"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
